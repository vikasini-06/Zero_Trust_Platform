services:
  # -------------------------------------------------------------
  # Zero Trust Backend API & Real-Time SOC Gateway (Web Service)
  # -------------------------------------------------------------
  - type: web
    name: zerotrust-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CLIENT_URL
        value: https://zero-trust-platform-virid.vercel.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://zero-trust-platform-virid.vercel.app

  # -------------------------------------------------------------
  # Zero Trust Cybersecurity Dashboard & UI (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: zerotrust-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
